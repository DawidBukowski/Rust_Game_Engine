[package]
name = "isometric_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["dynamic_linking"] }
bevy_egui = "0.43.1"
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"
